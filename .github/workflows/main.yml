# Github Actions to read CCIEA Google Drive and update Uploader Status table
# Need to grant read/write permissions for Action to do the commits
# Settings -> Actions -> General -> Workflow permissions
name: Deploy C-COAST web pages
# Use the following to update on push
on:
  push:
    branches: main
  workflow_dispatch:
permissions:
  contents: write  # Allows the token to push HTML to the gh-pages branch

concurrency:
  group: deploy-ccoast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true # use GITHUB_TOKEN for git push/auth
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          packages: |
            any::tidyverse
            any::rmarkdown
            any::knitr
      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add images/glider_transects/*/*.png
          git commit -m 'C-COAST updated' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2.1.2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions
